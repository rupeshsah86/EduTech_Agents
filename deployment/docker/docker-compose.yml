version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: eduverse_postgres
    environment:
      POSTGRES_DB: eduverse_db
      POSTGRES_USER: eduverse_user
      POSTGRES_PASSWORD: eduverse_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: eduverse_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../../backend
      dockerfile: ../deployment/docker/Dockerfile.backend
    container_name: eduverse_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ../../backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://eduverse_user:eduverse_password@postgres:5432/eduverse_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
